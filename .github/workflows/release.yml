name: Release Android and ESP32
run-name: Release ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (MAJOR.MINOR.PATCH, e.g. 1.0.1)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: clockinator-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Validate and update shared version
        run: |
          python3 scripts/test_release_version.py
          python3 scripts/release_version.py "$RELEASE_VERSION"
          if git rev-parse "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'This version tag already exists.' >&2
            exit 1
          fi
      - name: Load Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          names = ['KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Configure the four Android signing secrets described in RELEASES.md.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'clockinator-release.jks'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ANDROID_KEYSTORE_PATH={path}\n')
          PY
      - name: Build and test Android
        working-directory: android/alarm_controller
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          rm -f local.properties
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintRelease --console=plain
      - name: Build ESP32 (classic 4 MB, No OTA)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install 'GxEPD2@1.6.9' 'Adafruit GFX Library@1.12.6' 'Adafruit BusIO@1.17.4' 'ArduinoJson@7.4.3'
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=no_ota --build-path "$RUNNER_TEMP/clockinator-esp32" --output-dir dist/esp32 esp32/clockinator
          cp "$RUNNER_TEMP/clockinator-esp32/boot_app0.bin" dist/esp32/boot_app0.bin
      - name: Test clock time conversion
        run: |
          g++ -std=c++17 -Wall -Wextra esp32/tests/clock_time_test.cpp -o /tmp/clock-time-test
          /tmp/clock-time-test
          g++ -std=c++17 -Wall -Wextra esp32/tests/display_refresh_test.cpp -o /tmp/display-refresh-test
          /tmp/display-refresh-test
      - name: Package artifacts
        run: |
          cp android/alarm_controller/app/build/outputs/apk/release/app-release.apk "dist/clockinator-android-$RELEASE_VERSION.apk"
          python3 scripts/package_firmware.py dist/esp32 "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: clockinator-${{ inputs.version }}
          path: |
            dist/*.apk
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Commit version and push branch and tag atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.properties esp32/clockinator/Version.h
          git commit -m "chore: release v$RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" -m "Clockinator $RELEASE_VERSION"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/v$RELEASE_VERSION"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" dist/*.apk dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "Clockinator $RELEASE_VERSION" --generate-notes
